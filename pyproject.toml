[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawlint"
version = "0.1.0"
description = "Formality lint for patent drawing sheets (SVG or PDF) against USPTO 37 CFR 1.84"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
optional-dependencies = {pdf = ["pypdf==6.21.4"]}
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.urls]
Homepage = "https://github.com/drawlint/drawlint"

[project.scripts]
drawlint = "drawlint.cli:main"

[tool.setuptools.package-data]
drawlint = ["static/*"]
